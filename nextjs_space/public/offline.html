<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a0a2e">
  <title>Çevrimdışı - Canlifal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0a0118 0%, #1a0a2e 50%, #0f0520 100%);
      color: #e8d5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 420px;
      width: 100%;
    }
    .icon {
      font-size: 80px;
      margin-bottom: 24px;
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #d4a574, #f5e6d3);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p {
      font-size: 16px;
      line-height: 1.6;
      color: #b8a5c8;
      margin-bottom: 32px;
    }
    .retry-btn {
      display: inline-block;
      padding: 14px 32px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: white;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
    }
    .retry-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
    }
    .retry-btn:active {
      transform: translateY(0);
    }
    .stars {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: #fff;
      border-radius: 50%;
      animation: twinkle 3s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 0.8; }
    }
  </style>
</head>
<body>
  <div class="stars">
    <div class="star" style="top:10%;left:20%;animation-delay:0s"></div>
    <div class="star" style="top:30%;left:70%;animation-delay:0.5s"></div>
    <div class="star" style="top:60%;left:40%;animation-delay:1s"></div>
    <div class="star" style="top:20%;left:85%;animation-delay:1.5s"></div>
    <div class="star" style="top:75%;left:15%;animation-delay:2s"></div>
    <div class="star" style="top:45%;left:55%;animation-delay:0.3s"></div>
    <div class="star" style="top:85%;left:75%;animation-delay:1.2s"></div>
    <div class="star" style="top:15%;left:45%;animation-delay:0.8s"></div>
  </div>
  <div class="container">
    <div class="icon">🔮</div>
    <h1>Bağlantı Kesildi</h1>
    <p>İnternet bağlantınız yok gibi görünüyor. Yıldızlar hâlâ sizin için parlıyor — bağlantınızı kontrol edip tekrar deneyin.</p>
    <button class="retry-btn" onclick="window.location.reload()">Tekrar Dene</button>
  </div>
</body>
</html>
